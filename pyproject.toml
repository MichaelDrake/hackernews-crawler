[project]
name = "hn-crawler"
version = "0.1.0"
description = "Project to crawl hackernews page"
readme = "README.md"
authors = [
    { name = "Michael Morales", email = "michael.morales96@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
]

[project.scripts]
hn-crawler = "hn_crawler.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["hn_crawler"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --doctest-modules --cov=hn_crawler --cov-report=term-missing -m 'not live'"
markers = ["live: hits the real Hacker News (skipped by default)"]